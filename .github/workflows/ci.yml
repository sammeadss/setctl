name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Pinned so a new release cannot fail an unrelated PR. To bump, change values
  # and run `brew upgrade swiftformat swiftlint`, then locally fix anything the
  # new versions flag, and update `.swiftformat` and `.swiftlint.yml` to match.
  SWIFTFORMAT_VERSION: 0.64.1
  SWIFTLINT_VERSION: 0.65.1

jobs:
  build-and-test:
    name: Lint, Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Modules/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('Modules/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install linters
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -qo "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/bin"
          unzip -qo "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/swiftformat" "$RUNNER_TEMP/bin/swiftlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          swiftformat --version
          swiftlint --version

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

      - name: SwiftLint (strict)
        run: swiftlint --strict

      - name: Test Swift package
        run: swift test --package-path Modules

      - name: Build app
        run: >
          xcodebuild build
          -project Setctl/Setctl.xcodeproj
          -scheme Setctl
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
